plugins { id 'com.android.application' }
android {
    namespace 'ru.uchastok.game'
    compileSdk 34
    defaultConfig {
        applicationId "ru.uchastok.game"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
// перед сборкой копируем свежую игру в assets
tasks.register('copyGame', Copy) {
    from("${rootDir}/../dist/index.html")
    into("${projectDir}/src/main/assets")
}
preBuild.dependsOn copyGame
