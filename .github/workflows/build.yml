name: Auto-Generate Game & Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repo
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Godot 4 & Android Templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false
          include-templates: true

      - name: 4. Generate Project Files (Safe Bash)
        run: |
          printf '%s\n' \
            'config_version=5' \
            '[application]' \
            'config/name="OVD-94: Siege"' \
            'run/main_scene="res://Main.tscn"' \
            'config/features=PackedStringArray("4.2", "Mobile")' \
            '[display]' \
            'window/size/viewport_width=640' \
            'window/size/viewport_height=360' \
            'window/stretch/mode="viewport"' \
            'window/handheld/orientation=0' \
            '[rendering]' \
            'renderer/rendering_method="gl_compatibility"' \
            'renderer/rendering_method.mobile="gl_compatibility"' \
            'textures/canvas_textures/default_texture_filter=0' \
            > project.godot

          printf '%s\n' \
            '[gd_scene load_steps=2 format=3]' \
            '[ext_resource type="Script" path="res://OVDGameCore.gd" id="1"]' \
            '[node name="Main" type="Node3D"]' \
            'script = ExtResource("1")' \
            > Main.tscn

          cat << 'EOF' > OVDGameCore.gd
          extends Node3D

          var cam: Camera3D
          var arms_root: Node3D
          var left_arm: MeshInstance3D
          var right_arm: MeshInstance3D
          var is_female: bool = false
          var is_paused: bool = false
          var budget: int = 15000
          var ammo: int = 300
          var crime_timer: float = 7.0
          var yaw: float = 0.0

          var status_label: Label
          var radio_label: Label
          var cmd_panel: Panel

          var sectors = []
          var units = []
          var cmd_target_sector = [0, 1, 2]

          func _ready():
              build_ps1_station()
              build_player_and_viewmodel()
              build_tactical_hud()
              spawn_initial_squads()
              add_radio_log("[ДЕЖУРНАЯ ЧАСТЬ] Смена принята. За окном ливень. Ждем сводок.")

          func build_ps1_station():
              var env = WorldEnvironment.new()
              var e = Environment.new()
              e.background_mode = Environment.BG_COLOR
              e.background_color = Color(0.05, 0.06, 0.08)
              e.fog_enabled = true
              e.fog_light_color = Color(0.08, 0.1, 0.12)
              e.fog_density = 0.065
              env.environment = e
              add_child(env)

              create_box(Vector3(0, -0.5, 0), Vector3(40, 1, 40), Color(0.18, 0.2, 0.22))
              create_box(Vector3(0, 4.5, 0), Vector3(40, 1, 40), Color(0.12, 0.13, 0.15))

              var wall_col = Color(0.22, 0.34, 0.28)
              create_box(Vector3(0, 2, -18), Vector3(36, 4, 1), wall_col)
              create_box(Vector3(0, 2, 18), Vector3(36, 4, 1), wall_col)
              create_box(Vector3(-18, 2, 0), Vector3(1, 4, 36), wall_col)
              create_box(Vector3(18, 2, 0), Vector3(1, 4, 36), wall_col)
              create_box(Vector3(-6, 2, -4), Vector3(1, 4, 16), wall_col)
              create_box(Vector3(6, 2, 4), Vector3(1, 4, 16), wall_col)

              var light = OmniLight3D.new()
              light.position = Vector3(0, 3.8, 0)
              light.light_energy = 1.5
              light.omni_range = 28.0
              add_child(light)

              sectors.append({"name": "ДЕЖУРНАЯ ЧАСТЬ", "pos": Vector3(0, 0, 0)})
              sectors.append({"name": "ВХОДНОЙ ХОЛЛ", "pos": Vector3(
