name: Сборка APK
on: [push, workflow_dispatch]
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Сборка игры в один HTML
        run: npm i --no-save esbuild@0.23 && node tools/build.mjs
      - name: Быстрые тесты
        run: node test/combat_test.mjs && node test/world_test.mjs > /dev/null
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.9' }
      - name: Сборка APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: uchastok-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Выложить APK в ветку apk (чтобы скачать без Artifacts)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/uchastok.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rfq . || true
          git clean -fdxq
          cp /tmp/uchastok.apk ./uchastok.apk
          echo "APK игры «Участок». Собрано из ${GITHUB_SHA} (${GITHUB_REF_NAME}), $(date -u +%Y-%m-%dT%H:%MZ)." > README.md
          git add uchastok.apk README.md
          git commit -qm "APK из ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -f origin apk
