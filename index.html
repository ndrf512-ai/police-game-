<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0c0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Участок</title>
<style>
  html,body{margin:0;height:100%;background:#0b0c0e;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  #view{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:30}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b0c0e;color:#cfc8b0;font:14px 'Courier New',monospace;z-index:100;letter-spacing:2px}
  #boot h1{font-size:34px;margin:0 0 12px;letter-spacing:10px;color:#e8e0c8}
  #rotate{display:none;position:fixed;inset:0;background:#0b0c0e;color:#cfc8b0;font:16px 'Courier New',monospace;z-index:200;align-items:center;justify-content:center;text-align:center;padding:20px;flex-direction:column;gap:18px}
  #rotate button{font:14px 'Courier New',monospace;color:#cfc8b0;background:#1c1d20;border:1px solid #6b6557;padding:12px 18px;letter-spacing:1px}
  @media (orientation: portrait) and (pointer: coarse){ #rotate:not(.off){display:flex} }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui"></div>
<div id="boot"><h1>УЧАСТОК</h1><div class="msg">Загрузка…</div></div>
<div id="rotate"><div>Поверните телефон горизонтально<br><br>⟲</div><div style="font-size:12px;opacity:.7;max-width:22em">Если экран не поворачивается, включите автоповорот или откройте страницу в браузере.</div><button type="button" onclick="document.getElementById('rotate').classList.add('off')">Играть вертикально</button></div>
<script type="module">
  import { boot } from './src/main.js';
  boot().catch((e) => { console.error(e); const b = document.getElementById('boot'); if (b) b.querySelector('.msg').textContent = 'Ошибка: ' + e.message; });
</script>
</body>
</html>
